services:
  - type: web
    name: repoheal
    runtime: python
    buildCommand: npm install --prefix frontend --no-package-lock && npm run build --prefix frontend && python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WEBTOOL_API_URL
        value: https://restrictedwebtool-ueji.onrender.com
      - key: INTERNAL_API_KEY
        sync: false
