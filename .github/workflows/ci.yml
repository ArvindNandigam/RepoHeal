name: RepoHeal CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install frontend dependencies
      run: npm ci --prefix frontend

    - name: Type check frontend
      run: npm run typecheck --prefix frontend

    - name: Build frontend
      run: npm run build --prefix frontend
        
    - name: Legacy Python typing audit (non-blocking during cleanup)
      continue-on-error: true
      run: |
        mypy --explicit-package-bases app/
        
    - name: Lint with ruff
      run: |
        ruff check app/ --select E9,F63,F7,F82
        
    - name: Test with pytest
      run: |
        python -m pytest tests/ test_phase1.py test_phase2.py
