<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoHeal</title>
  <style>
    :root { color-scheme: dark; --bg: #101214; --surface: #181a1d; --text: #e8eaed; --muted: #9aa0a6; --accent: #42d6a4; --border: rgba(255,255,255,0.06); }
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { padding: 40px; border-radius: 12px; background: rgba(30,33,36,0.96); border: 1px solid var(--border); text-align: center; max-width: 400px; width: 90%; }
    h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; line-height: 1.5; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 8px; font-size: 15px; font-weight: 600; border: 1px solid transparent; background: var(--accent); color: #06121c; cursor: pointer; text-decoration: none; }
    .btn:hover { background: #3bc494; }
    .btn.secondary { background: transparent; border-color: var(--border); color: var(--muted); }
    .btn.secondary:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .links { margin-top: 20px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .links a { color: var(--muted); font-size: 13px; text-decoration: none; }
    .links a:hover { color: var(--accent); }
    .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .badge { display: inline-flex; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 20px; }
    .badge.success { background: rgba(66,214,164,0.15); color: var(--accent); border: 1px solid rgba(66,214,164,0.3); }
    .badge.warning { background: rgba(244,201,93,0.15); color: var(--accent-2); border: 1px solid rgba(244,201,93,0.3); }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge {{ status_class }}">{{ status_badge }}</div>
    <h1>RepoHeal</h1>
    <p class="sub">{{ status_message }}</p>
    <a class="btn" href="/auth/github/login">Sign in with GitHub</a>
    <hr class="divider">
    <div class="links">
      <a href="/auth/github/login?force_login=true">Use a different GitHub account</a>
      <a href="/dashboard">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
