<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoHeal Migration Document Center</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1113;
      --panel: #1c1f22;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f4f6f8;
      --muted: #a8b0b8;
      --accent: #42d6a4;
    }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
    .container { max-width: 1000px; margin: 0 auto; display: grid; gap: 24px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 32px; line-height: 1.6; }
    .markdown-body { color: var(--text); }
    .markdown-body h1, .markdown-body h2 { border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-top: 24px; }
    .markdown-body code { background: rgba(255,255,255,0.05); padding: 2px 4px; border-radius: 4px; font-family: monospace; }
    .markdown-body pre { background: rgba(0,0,0,0.3); padding: 16px; border-radius: 8px; overflow-x: auto; }
    .pill { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; text-decoration: none; background: rgba(255,255,255,0.1); color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1>Migration Document</h1>
      <a href="/dashboard" class="pill">Back to Dashboard</a>
    </div>
    <div class="card markdown-body" id="docContent">Loading...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    async function loadDoc() {
      const pathParts = window.location.pathname.split("/");
      const repoOwner = pathParts[2];
      const repoName = pathParts[3];
      const analysisId = new URLSearchParams(window.location.search).get("analysis_id");
      
      try {
        const url = `/reports/${repoOwner}/${repoName}/migration` + (analysisId ? `?analysis_id=${analysisId}` : "");
        const response = await fetch(url);
        const data = await response.json();
        
        document.getElementById("docContent").innerHTML = marked.parse(data.content || "# No content available");
      } catch (err) {
        document.getElementById("docContent").textContent = "Error loading migration document.";
      }
    }
    loadDoc();
  </script>
</body>
</html>
