<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoHeal Migration Reports</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1113; --panel: #1c1f22; --border: rgba(255,255,255,0.1); --text: #f4f6f8; --muted: #a8b0b8; --accent: #42d6a4; --warning: #f4c95d; --danger: #f97066; }
    * { box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    h1 { margin: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 18px; border-radius: 999px; text-decoration: none; font-weight: 600; border: 0; cursor: pointer; color: #021019; background: linear-gradient(135deg, var(--accent), var(--warning)); font-size: 13px; }
    .btn.ghost { color: var(--text); background: rgba(255,255,255,0.08); border: 1px solid var(--border); }
    .migration-card { display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
    .migration-card:hover { border-color: var(--accent); }
    .migration-card .meta { display: flex; gap: 16px; align-items: center; }
    .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge.low { background: rgba(66,214,164,0.15); color: var(--accent); }
    .badge.medium { background: rgba(244,201,93,0.15); color: var(--warning); }
    .badge.high { background: rgba(249,112,102,0.15); color: var(--danger); }
    .badge.status { background: rgba(255,255,255,0.06); border: 1px solid var(--border); }
    .empty-state { padding: 32px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; }
    .loading-state { padding: 32px; text-align: center; color: var(--muted); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Migration Reports</h1>
        <p id="repoMeta" style="color: var(--muted); margin-top: 4px;"></p>
      </div>
      <a href="/dashboard" class="btn ghost">Back to Dashboard</a>
    </div>

    <div id="loadingState" class="loading-state">Loading migration reports...</div>
    <div id="emptyState" class="empty-state hidden">No migration reports found. Run a health refresh first.</div>
    <div id="migrationList" class="hidden"></div>
  </div>

  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const repoOwner = params.get("repo_owner");
      const repoName = params.get("repo_name");

      if (!repoOwner || !repoName) {
        document.getElementById("loadingState").textContent = "Missing repo_owner or repo_name parameters.";
        return;
      }

      document.getElementById("repoMeta").textContent = `${repoOwner}/${repoName}`;

      try {
        const res = await fetch(`/migrations/${repoOwner}/${repoName}`, { credentials: "same-origin" });
        if (!res.ok) throw new Error(`API returned ${res.status}`);
        const data = await res.json();
        const migrations = data.migrations || [];

        document.getElementById("loadingState").classList.add("hidden");

        if (migrations.length === 0) {
          document.getElementById("emptyState").classList.remove("hidden");
          return;
        }

        const list = document.getElementById("migrationList");
        list.classList.remove("hidden");

        migrations.forEach(m => {
          const card = document.createElement("div");
          card.className = "migration-card";

          const risk = m.risk_score || 0;
          const riskClass = risk > 70 ? "high" : risk > 30 ? "medium" : "low";
          const status = m.status || "completed";

          card.innerHTML = `
            <div class="meta">
              <span class="badge ${riskClass}">${risk}</span>
              <span class="badge status">${status}</span>
              <span style="font-size:12px;color:var(--muted);">${m.analysis_id ? m.analysis_id.slice(0, 16) : ""}</span>
              <span style="font-size:12px;color:var(--muted);">${m.timestamp ? new Date(m.timestamp).toLocaleString() : ""}</span>
            </div>
          `;
          list.appendChild(card);
        });
      } catch (err) {
        document.getElementById("loadingState").textContent = `Error: ${err.message}`;
      }
    })();
  </script>
</body>
</html>
