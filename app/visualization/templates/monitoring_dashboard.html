<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoHeal Monitoring</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1113; --panel: #1c1f22; --border: rgba(255,255,255,0.1); --text: #f4f6f8; --muted: #a8b0b8; --accent: #42d6a4; --warning: #f4c95d; --danger: #f97066; }
    * { box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1, h2, h3 { margin: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .full { grid-column: 1/-1; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; border-radius: 999px; text-decoration: none; font-weight: 600; border: 1px solid var(--border); cursor: pointer; color: var(--text); background: rgba(255,255,255,0.06); font-size: 13px; }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--warning)); color: #021019; border: 0; }
    .badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge.low { background: rgba(66,214,164,0.2); color: var(--accent); }
    .badge.medium { background: rgba(244,201,93,0.2); color: var(--warning); }
    .badge.high { background: rgba(249,112,102,0.2); color: var(--danger); }
    .badge.critical { background: rgba(249,50,50,0.3); color: #ff6b6b; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }
    .loading { padding: 40px; text-align: center; color: var(--muted); }
    .error { padding: 40px; text-align: center; color: var(--danger); }
    .hidden { display: none !important; }
    .health-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 4px; }
    .health-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
    svg text { fill: var(--muted); font-size: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 id="repoTitle">Monitoring</h1>
        <p id="repoSubtitle" style="color: var(--muted); margin-top: 4px;"></p>
      </div>
      <a href="/dashboard" class="btn">Back to Dashboard</a>
      <a id="feedbackBtn" class="btn" href="{{ feedback_link }}" target="_blank" rel="noopener" style="display:none;">Feedback</a>
    </div>

    <div id="loadingState" class="loading">Loading monitoring data...</div>
    <div id="errorState" class="error hidden"></div>

    <div id="dashboardContent" class="hidden">
      <div class="grid-3" id="summaryCards"></div>

      <div class="grid">
        <div class="panel full">
          <h3 style="margin-bottom: 10px;">Health Score History</h3>
          <div id="healthChart" style="height: 120px; display: flex; align-items: flex-end; gap: 4px; padding: 10px 0;"></div>
        </div>
      </div>

      <div class="grid">
        <div class="panel full">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3>Active Alerts</h3>
            <button class="btn primary" id="refreshBtn">Refresh</button>
          </div>
          <table id="alertsTable">
            <thead><tr><th>Category</th><th>Severity</th><th>Title</th><th>Package</th><th>Created</th><th>Actions</th></tr></thead>
            <tbody id="alertsBody"></tbody>
          </table>
          <div id="noAlerts" class="hidden" style="text-align: center; padding: 20px; color: var(--muted);">No active alerts.</div>
        </div>
      </div>

      <div class="grid">
        <div class="panel full">
          <h3 style="margin-bottom: 12px;">Dependency Watchlist</h3>
          <table id="watchlistTable">
            <thead><tr><th>Package</th><th>Installed</th><th>Latest</th><th>Risk</th><th>Monitored Since</th><th>Auto-Upgrade</th></tr></thead>
            <tbody id="watchlistBody"></tbody>
          </table>
          <div id="noWatchlist" class="hidden" style="text-align: center; padding: 20px; color: var(--muted);">No watchlist entries.</div>
        </div>
      </div>

      <div class="panel full">
        <h3 style="margin-bottom: 12px;">Monitoring Schedule</h3>
        <div id="scheduleInfo" style="color: var(--muted);">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      const params = new URLSearchParams(window.location.search);
      const owner = params.get("repo_owner");
      const name = params.get("repo_name");

      if (!owner || !name) {
        document.getElementById("loadingState").classList.add("hidden");
        document.getElementById("errorState").classList.remove("hidden");
        document.getElementById("errorState").textContent = "Missing repo_owner or repo_name query parameters.";
        return;
      }

      document.getElementById("repoTitle").textContent = `${owner}/${name} Monitoring`;
      document.getElementById("repoSubtitle").textContent = "Health history, alerts, watchlist & schedule";

      async function fetchData() {
        const res = await fetch(`/monitor/dashboard/${owner}/${name}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }

      function render(data) {
        document.getElementById("loadingState").classList.add("hidden");
        document.getElementById("dashboardContent").classList.remove("hidden");

        const history = data.health_history || [];
        const alerts = data.active_alerts || [];
        const watchlist = data.watchlist || [];
        const schedule = data.schedule || {};

        const currentScore = history.length > 0 ? history[history.length - 1].health_score : 0;
        const riskLevel = history.length > 0 ? history[history.length - 1].risk_level : "unknown";

        document.getElementById("summaryCards").innerHTML = `
          <div class="panel" style="text-align: center;">
            <div style="font-size: 36px; font-weight: 700; color: ${currentScore >= 70 ? 'var(--accent)' : currentScore >= 40 ? 'var(--warning)' : 'var(--danger)'}">${currentScore}</div>
            <div style="color: var(--muted); font-size: 12px; margin-top: 4px;">Health Score</div>
          </div>
          <div class="panel" style="text-align: center;">
            <div style="font-size: 36px; font-weight: 700; color: ${alerts.length > 0 ? 'var(--warning)' : 'var(--accent)'}">${alerts.length}</div>
            <div style="color: var(--muted); font-size: 12px; margin-top: 4px;">Active Alerts</div>
          </div>
          <div class="panel" style="text-align: center;">
            <div style="font-size: 36px; font-weight: 700; color: ${watchlist.length > 0 ? 'var(--warning)' : 'var(--muted)'}">${watchlist.length}</div>
            <div style="color: var(--muted); font-size: 12px; margin-top: 4px;">Watchlist Entries</div>
          </div>
        `;

        const chartEl = document.getElementById("healthChart");
        chartEl.innerHTML = "";
        const scores = history.map(h => h.health_score);
        const maxScore = 100;
        scores.forEach((s, i) => {
          const bar = document.createElement("div");
          const pct = (s / maxScore) * 100;
          bar.style.height = Math.max(pct, 4) + "%";
          bar.style.width = Math.max(100 / scores.length - 2, 4) + "px";
          bar.style.background = s >= 70 ? "var(--accent)" : s >= 40 ? "var(--warning)" : "var(--danger)";
          bar.style.borderRadius = "3px 3px 0 0";
          bar.title = `${history[i].recorded_at ? new Date(history[i].recorded_at).toLocaleDateString() : ""}: ${s}`;
          chartEl.appendChild(bar);
        });
        if (scores.length === 0) chartEl.innerHTML = '<div style="color: var(--muted);">No health history yet.</div>';

        const alertsBody = document.getElementById("alertsBody");
        const noAlerts = document.getElementById("noAlerts");
        if (alerts.length === 0) {
          alertsBody.innerHTML = "";
          noAlerts.classList.remove("hidden");
        } else {
          noAlerts.classList.add("hidden");
          alertsBody.innerHTML = alerts.slice(0, 20).map(a => `
            <tr>
              <td>${a.category || "—"}</td>
              <td><span class="badge ${(a.severity || "low").toLowerCase()}">${a.severity || "low"}</span></td>
              <td>${a.title || "—"}</td>
              <td>${a.package_name || "—"}</td>
              <td>${a.created_at ? new Date(a.created_at).toLocaleDateString() : "—"}</td>
              <td>
                <button class="btn" style="padding: 4px 8px; font-size: 11px;" onclick="dismissAlert('${a.id}')">Dismiss</button>
              </td>
            </tr>
          `).join("");
        }

        const watchlistBody = document.getElementById("watchlistBody");
        const noWatchlist = document.getElementById("noWatchlist");
        if (watchlist.length === 0) {
          watchlistBody.innerHTML = "";
          noWatchlist.classList.remove("hidden");
        } else {
          noWatchlist.classList.add("hidden");
          watchlistBody.innerHTML = watchlist.map(w => `
            <tr>
              <td><strong>${w.package_name || "—"}</strong></td>
              <td>${w.installed_version || "—"}</td>
              <td>${w.latest_version || "—"}</td>
              <td><span class="badge ${(w.risk_level || "low").toLowerCase()}">${w.risk_level || "low"}</span></td>
              <td>${w.monitored_since ? new Date(w.monitored_since).toLocaleDateString() : "—"}</td>
              <td>${w.auto_upgrade ? "✓" : "—"}</td>
            </tr>
          `).join("");
        }

        document.getElementById("scheduleInfo").innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <div><strong>Frequency:</strong> ${schedule.frequency || "manual"}</div>
            <div><strong>Branches:</strong> ${(schedule.branches || []).join(", ")}</div>
            <div><strong>Watch Deps:</strong> ${schedule.watch_dependencies ? "✓" : "✗"}</div>
            <div><strong>Auto Remediate:</strong> ${schedule.auto_remediate ? "✓" : "✗"}</div>
            <div><strong>Digest Enabled:</strong> ${schedule.digest_enabled ? "✓" : "✗"}</div>
            <div><strong>Last Run:</strong> ${schedule.last_run ? new Date(schedule.last_run).toLocaleString() : "never"}</div>
          </div>
        `;
      }

      document.getElementById("refreshBtn").addEventListener("click", async () => {
        try {
          const data = await fetchData();
          render(data);
        } catch (e) {
          document.getElementById("errorState").textContent = `Refresh failed: ${e.message}`;
          document.getElementById("errorState").classList.remove("hidden");
        }
      });

      try {
        const data = await fetchData();
        render(data);
      } catch (e) {
        document.getElementById("loadingState").classList.add("hidden");
        document.getElementById("errorState").classList.remove("hidden");
        document.getElementById("errorState").textContent = `Error loading dashboard: ${e.message}`;
      }
    }

    async function dismissAlert(alertId) {
      try {
        const res = await fetch(`/monitor/alerts/${alertId}/dismiss`, { method: "POST" });
        if (res.ok) location.reload();
      } catch (e) {
        alert("Failed to dismiss: " + e.message);
      }
    }

    loadDashboard();
  </script>
  <script>
    (function() {
      const fb = document.getElementById("feedbackBtn");
      if (fb && (!fb.getAttribute("href") || fb.getAttribute("href") === "")) {
        fb.style.display = "none";
      } else if (fb) {
        fb.style.display = "inline-flex";
      }
    })();
  </script>
</body>
</html>
