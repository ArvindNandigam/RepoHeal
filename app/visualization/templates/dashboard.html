<!DOCTYPE html>
<html>
<head>
    <title>RepoHeal Dashboard</title>
</head>

<body>

<h2>
    {{ username }}
</h2>

<hr>

{% if repositories|length == 0 %}

<p>
    No repositories with RepoHeal installed were found.
</p>

{% endif %}

{% for repo in repositories %}

<div
    style="
        border:1px solid #ccc;
        padding:16px;
        margin-bottom:16px;
    "
>

    <h3>
        {{ repo.name }}
    </h3>

    <p>
        Visibility:
        {% if repo.private %}
            Private
        {% else %}
            Public
        {% endif %}
    </p>

    <a href="{{ repo.analyze_url }}">
        Analyze
    </a>

    <br><br>

    <a href="{{ repo.visualize_url }}">
        Visualize
    </a>

    <br><br>

    <a href="{{ repo.workspace_url }}">
        Workspace
    </a>

</div>

{% endfor %}

</body>
</html>
